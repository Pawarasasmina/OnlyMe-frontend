name: Localization
on:
  pull_request:
  push:
    branches: [Dev-stable, Nethmi-last-New]
jobs:
  localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:i18n
      - run: npm run i18n:check
      - run: npm run build
